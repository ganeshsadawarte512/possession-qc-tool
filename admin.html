<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Create Users</title>
<style>
  :root{ --accent:#c1740f; --bg:#f4f1ea; --panel:#fff; --text:#222; --text-dim:#777; --radius:8px; --border:#ddd; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:28px; width:100%; max-width:380px; }
  h2{ margin:0 0 4px; font-size:20px; }
  p.sub{ font-size:12px; color:var(--text-dim); margin:0 0 18px; line-height:1.5; }
  input{ width:100%; padding:10px 12px; margin-bottom:10px; border:1px solid var(--border); border-radius:var(--radius); font-size:14px; }
  .btn{ width:100%; padding:10px 12px; border:none; border-radius:var(--radius); font-size:14px; cursor:pointer; margin-top:4px; }
  .btn.primary{ background:var(--accent); color:#fff; font-weight:600; }
  .btn.secondary{ background:none; color:var(--text-dim); text-decoration:underline; margin-top:10px; }
  .msg{ font-size:13px; margin-top:10px; min-height:18px; }
  .msg.error{ color:#b3261e; }
  .msg.success{ color:#2e7d32; }
  .hidden{ display:none !important; }
  .divider{ border-top:1px solid var(--border); margin:20px 0; }
  .list{ font-size:12px; color:var(--text-dim); }
</style>
</head>
<body>

<!-- Admin must sign in with the SAME admin account used for the main tool -->
<div class="card" id="admin-login-card">
  <h2>Admin Sign In</h2>
  <p class="sub">Only the designated admin account can access this page.</p>
  <input type="email" id="admin-email" placeholder="Admin email" autocomplete="username" autofocus>
  <input type="password" id="admin-pw" placeholder="Admin password" autocomplete="current-password">
  <button class="btn primary" id="admin-login-btn">Sign In</button>
  <div class="msg error" id="admin-login-error"></div>
</div>

<!-- Shown only after the admin signs in -->
<div class="card hidden" id="create-user-card">
  <h2>Create New User</h2>
  <p class="sub">Signed in as <strong id="admin-who"></strong>. Anyone you create here can log in to the main tool with the email and password you set below.</p>
  <input type="email" id="new-user-email" placeholder="New user's email" autocomplete="off">
  <input type="password" id="new-user-pw" placeholder="Password (6+ characters)" autocomplete="off" minlength="6">
  <button class="btn primary" id="create-user-btn">Create User</button>
  <div class="msg" id="create-msg"></div>
  <div class="divider"></div>
  <button class="btn secondary" id="admin-logout-btn">Log out</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script>
/* ============ Admin page: create new users ============
   Only the account listed in ADMIN_EMAIL can use this page to create new users.
   New users are created through a SEPARATE, temporary Firebase app instance so that
   doing so never signs the admin out of their own session on this page. */

const firebaseConfig = {
  apiKey: "AIzaSyAvXCKIKQiEKkKL2dKvkILAgziZfgkv1vE",
  authDomain: "shottracker-qc-2638d.firebaseapp.com",
  projectId: "shottracker-qc-2638d",
  storageBucket: "shottracker-qc-2638d.firebasestorage.app",
  messagingSenderId: "475802433746",
  appId: "1:475802433746:web:400372d1defbe4c55e950b"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

const ADMIN_EMAIL = "ganeshsprivan@gmail.com"; // change this if your admin account is different

const loginCard = document.getElementById('admin-login-card');
const createCard = document.getElementById('create-user-card');
const loginErr = document.getElementById('admin-login-error');

document.getElementById('admin-login-btn').addEventListener('click', async ()=>{
  const email = document.getElementById('admin-email').value.trim();
  const pw = document.getElementById('admin-pw').value;
  loginErr.textContent = '';
  try{
    const cred = await auth.signInWithEmailAndPassword(email, pw);
    if(cred.user.email !== ADMIN_EMAIL){
      await auth.signOut();
      loginErr.textContent = 'This account is not the admin account.';
    }
  }catch(err){
    loginErr.textContent = 'Incorrect email or password.';
  }
});

document.getElementById('admin-logout-btn').addEventListener('click', ()=>{
  auth.signOut();
});

auth.onAuthStateChanged(user=>{
  if(user && user.email === ADMIN_EMAIL){
    loginCard.classList.add('hidden');
    createCard.classList.remove('hidden');
    document.getElementById('admin-who').textContent = user.email;
  }else{
    loginCard.classList.remove('hidden');
    createCard.classList.add('hidden');
  }
});

document.getElementById('create-user-btn').addEventListener('click', async ()=>{
  const email = document.getElementById('new-user-email').value.trim();
  const pw = document.getElementById('new-user-pw').value;
  const msg = document.getElementById('create-msg');
  msg.textContent = ''; msg.className = 'msg';

  if(!auth.currentUser || auth.currentUser.email !== ADMIN_EMAIL){
    msg.textContent = 'Only the admin account can create users.';
    msg.className = 'msg error';
    return;
  }
  if(!email || pw.length < 6){
    msg.textContent = 'Enter a valid email and a password of 6+ characters.';
    msg.className = 'msg error';
    return;
  }
  try{
    const secondaryApp = firebase.initializeApp(firebaseConfig, "Secondary-" + Date.now());
    const secondaryAuth = secondaryApp.auth();
    await secondaryAuth.createUserWithEmailAndPassword(email, pw);
    await secondaryAuth.signOut();
    await secondaryApp.delete();
    msg.textContent = 'User created: ' + email;
    msg.className = 'msg success';
    document.getElementById('new-user-email').value = '';
    document.getElementById('new-user-pw').value = '';
  }catch(err){
    msg.textContent = err.message || 'Could not create user.';
    msg.className = 'msg error';
  }
});
</script>
</body>
</html>
